    maintenance: <MaintenancePage/>, invoices: <InvoicesPage/>, payouts: <PayoutsPage/>,
  };

    <Layout style={{minHeight:'100vh'}}>
      <Sider theme="dark">
        <div style={{padding:16,textAlign:'center',color:'#fff'}}>
          <Typography.Title level={4} style={{color:'#fff',margin:0}}>PQT AfterSales</Typography.Title>
          <Typography.Text style={{color:'#888',fontSize:11}}>Internal Portal</Typography.Text>

        <Menu theme="dark" mode="inline" selectedKeys={[tab]} items={internalMenu} onClick={({key})=>setTab(key)}/>

      <Layout>
        <Header style={{background:'#fff',padding:'0 24px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <Typography.Text strong>PQT Staff Portal</Typography.Text>
          <Space>
            <Button onClick={onSwitch}>Switch to Client View →</Button>
            <Avatar style={{backgroundColor:'#1677ff'}}>A</Avatar>
            <span>PQT Admin</span>

        </Header>
        <Content style={{margin:24,padding:24,background:'#fff',borderRadius:8}}>
          {pages[tab]}
        </Content>
      </Layout>
    </Layout>
  );
}

    {title:'Tax', dataIndex:'tax_amount', render:v=>`AED ${v}`},
    {title:'Mgmt Fee', dataIndex:'management_fee', render:v=>`AED ${v}`},
    {title:'Net to You', dataIndex:'net_to_owner', render:v=><strong>AED {v.toLocaleString()}</strong>},
    {title:'Due', dataIndex:'due_date'},
    {title:'Status', dataIndex:'status', render:v=><Tag color={scolor[v]}>{v}</Tag>},
  ];
  return (<div>
    <Typography.Title level={4}>Invoices & Income</Typography.Title>
    <Card style={{marginBottom:24}}>
      <Descriptions bordered column={{xs:1,sm:2,lg:4}}>
        <Descriptions.Item label="Total Collected"><strong>AED {totals.collected.toLocaleString()}</strong></Descriptions.Item>
        <Descriptions.Item label="Management Fees"><span style={{color:'#cf1322'}}>AED {totals.fees.toLocaleString()}</span></Descriptions.Item>
        <Descriptions.Item label="Tax"><span style={{color:'#cf1322'}}>AED {totals.tax.toLocaleString()}</span></Descriptions.Item>
        <Descriptions.Item label="Net to You"><span style={{color:'#3f8600',fontWeight:'bold'}}>AED {totals.net.toLocaleString()}</span></Descriptions.Item>
      </Descriptions>
    </Card>
    <Table columns={cols} dataSource={myInv} rowKey="id" pagination={false} scroll={{x:true}}/>
  </div>);
}

function ClientPayouts() {
  const cols = [
    {title:'Period', render:(_,r)=>`${r.period_start} to ${r.period_end}`},
    {title:'Gross Rental', dataIndex:'gross_rental_income', render:v=>`AED ${v.toLocaleString()}`},
    {title:'Mgmt Fee', dataIndex:'management_fee', render:v=><span style={{color:'#cf1322'}}>- AED {v}</span>},
    {title:'Maintenance', dataIndex:'maintenance_costs', render:v=>v>0?<span style={{color:'#cf1322'}}>- AED {v}</span>:'-'},
    {title:'Tax', dataIndex:'tax_amount', render:v=><span style={{color:'#cf1322'}}>- AED {v}</span>},
    {title:'Net Payout', dataIndex:'net_payout', render:v=><strong style={{color:'#3f8600'}}>AED {v.toLocaleString()}</strong>},
    {title:'Status', dataIndex:'status', render:v=><Tag color="green">{v}</Tag>},
    {title:'Paid Date', dataIndex:'paid_date'},
  ];
  const totalPaid = payouts.reduce((s,p)=>s+p.net_payout, 0);
  const totalGross = payouts.reduce((s,p)=>s+p.gross_rental_income, 0);
  const totalDeductions = payouts.reduce((s,p)=>s+p.management_fee+p.maintenance_costs+p.tax_amount, 0);
  return (<div>
    <Typography.Title level={4}>My Payouts</Typography.Title>
    <Card style={{marginBottom:24}}>
      <Descriptions bordered column={{xs:1,sm:3}}>
        <Descriptions.Item label="Total Gross Income"><strong>AED {totalGross.toLocaleString()}</strong></Descriptions.Item>
        <Descriptions.Item label="Total Deductions"><span style={{color:'#cf1322'}}>AED {totalDeductions.toLocaleString()}</span></Descriptions.Item>
        <Descriptions.Item label="Total Paid Out"><span style={{color:'#3f8600',fontWeight:'bold',fontSize:16}}>AED {totalPaid.toLocaleString()}</span></Descriptions.Item>
      </Descriptions>
    </Card>
    <Table columns={cols} dataSource={payouts} rowKey="id" pagination={false} scroll={{x:true}}/>
  </div>);
}

function ClientPortal({ onSwitch }) {
  const [tab, setTab] = useState('dashboard');
  const pages = {
    dashboard: <ClientDashboard/>, properties: <ClientProperties/>,
    invoices: <ClientInvoices/>, payouts: <ClientPayouts/>,
  };
  return (
    <Layout style={{minHeight:'100vh'}}>
      <Sider theme="dark" style={{background:'#001529'}}>
        <div style={{padding:16,textAlign:'center',color:'#fff'}}>
          <Typography.Title level={4} style={{color:'#fff',margin:0}}>PQT Client</Typography.Title>
          <Typography.Text style={{color:'#888',fontSize:11}}>Owner Portal</Typography.Text>
        </div>
        <Menu theme="dark" mode="inline" selectedKeys={[tab]} items={clientMenu} onClick={({key})=>setTab(key)}/>
      </Sider>
      <Layout>
        <Header style={{background:'#fff',padding:'0 24px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <Typography.Text strong>Welcome back, Ahmed Al-Mansoori</Typography.Text>
          <Space>
            <Button onClick={onSwitch}>← Switch to Internal View</Button>
            <Avatar style={{backgroundColor:'#52c41a'}}>A</Avatar>
            <span>Ahmed Al-Mansoori</span>
          </Space>
        </Header>
        <Content style={{margin:24,padding:24,background:'#fff',borderRadius:8}}>
          {pages[tab]}
        </Content>
      </Layout>
    </Layout>
  );
}

// ===== ROOT =====
function App() {
  const [view, setView] = useState('internal'); // 'internal' | 'client'
  return (
    <ConfigProvider theme={{token:{colorPrimary:'#1677ff',borderRadius:6}}}>
      {view === 'internal'
        ? <InternalPortal onSwitch={()=>setView('client')}/>
        : <ClientPortal onSwitch={()=>setView('internal')}/>
      }
    </ConfigProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
</html>
